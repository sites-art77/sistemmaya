<script>
window.__mayaErr=[];
function __mayaShowErr(m){window.__mayaErr.push(m);var d=document.getElementById('errbox');if(d){d.style.display='block';d.textContent='Erro: '+window.__mayaErr.join(' | ').slice(0,400);}}
function __mayaNoise(m){
  m=String(m||'');
  return !m || m==='Script error.' || m==='Script error' || /script error/i.test(m) || /ResizeObserver loop/i.test(m) || /The operation was aborted/i.test(m) || /AbortError/i.test(m) || /NotAllowedError/i.test(m) || /cancelled|canceled/i.test(m);
}
window.onerror=function(m,s,l){
  if(__mayaNoise(m)) return true;
  if(!s && (!l || l===0)) return true;
  __mayaShowErr(m+' @'+String(s||'').split('/').pop()+':'+l);
  return false;
};
window.addEventListener('unhandledrejection',function(e){
  var r=e&&e.reason, name=r&&r.name, msg=String((r&&r.message)||r||'');
  if(name==='AbortError'||name==='NotAllowedError'||__mayaNoise(msg)) return;
  __mayaShowErr('Falha: '+msg.slice(0,120));
});
window.addEventListener('DOMContentLoaded',function(){
  try{var t=document.createElement('div');t.className='hidden';t.style.position='absolute';document.body.appendChild(t);
  var ok=getComputedStyle(t).display==='none';t.remove();
  if(!ok){var l=document.createElement('link');l.rel='stylesheet';l.href='fallback.css';document.head.appendChild(l);}}catch(e){}
});
</script>

window._pwaPrompt=null;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();window._pwaPrompt=e;window.dispatchEvent(new Event('maya-pwa-ready'));});
window.addEventListener('appinstalled',function(){window._pwaPrompt=null;});
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('./sw.js?v=12').then(function(reg){try{reg.update();}catch(e){}}).catch(function(){});
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      try{ if(sessionStorage.getItem('maya_sw_reload')==='1') return; sessionStorage.setItem('maya_sw_reload','1'); }catch(e){}
      location.reload();
    });
  });
}
</script>
