<script>
window.__mayaErr=[];
function __mayaShowErr(m){
  window.__mayaErr.push(m);
  var d=document.getElementById('errbox');
  if(d){
    d.style.display='block';
    d.innerHTML='Erro: '+window.__mayaErr.join(' | ').slice(0,400)+' <button type="button" style="margin-left:8px;font:700 12px sans-serif;background:#fff;color:#a11a1a;border:0;border-radius:8px;padding:4px 8px" onclick="this.parentNode.style.display=\'none\';window.__mayaErr=[]">Fechar</button>';
  }
}
function __mayaNoise(m){
  m=String(m||'');
  return !m || m==='Script error.' || m==='Script error' || /script error/i.test(m) || /ResizeObserver loop/i.test(m) || /The operation was aborted/i.test(m) || /AbortError/i.test(m) || /NotAllowedError/i.test(m) || /cancelled|canceled/i.test(m);
}
window.onerror=function(m,s,l){
  if(__mayaNoise(m)) return true;
  if(!s && (!l || l===0)) return true;
  __mayaShowErr(m+' @'+String(s||'').split('/').pop()+':'+l);
  return false;
};
window.addEventListener('unhandledrejection',function(e){
  var r=e&&e.reason, name=r&&r.name, msg=String((r&&r.message)||r||'');
  if(name==='AbortError'||name==='NotAllowedError'||__mayaNoise(msg)) return;
  __mayaShowErr('Falha: '+msg.slice(0,120));
});
window.addEventListener('DOMContentLoaded',function(){
  try{var t=document.createElement('div');t.className='hidden';t.style.position='absolute';document.body.appendChild(t);
  var ok=getComputedStyle(t).display==='none';t.remove();
  if(!ok){var l=document.createElement('link');l.rel='stylesheet';l.href='fallback.css';document.head.appendChild(l);}}catch(e){}
});
</script>
</head>
<body>
<div id="errbox" role="alert" aria-live="assertive" style="display:none;background:#a11a1a;color:#fff;padding:10px;font:700 13px sans-serif"></div>
<div id="pwa-banner" hidden></div>
<div id="app"><div class="max-w-6xl mx-auto p-8 text-center">Carregando MAYA Garden…</div></div>
<script src="store.js?v=11"></script>
<script src="cloud.js?v=10"></script>
<script src="pricing.js?v=9"></script>
<script src="pdf.js?v=14"></script>
<script src="app.js?v=42"></script>
<script src="pro.js?v=24"></script>
<script src="reminders.js?v=5"></script>
<script src="mobile-pdf.js?v=6"></script>
<script>
window._pwaPrompt=null;
function __mayaStandalone(){
  try{ return matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches || navigator.standalone===true; }catch(e){ return false; }
}
function __mayaInApp(){
  var ua=navigator.userAgent||'';
  return /FBAN|FBAV|Instagram|Line\/|Twitter|WhatsApp|GSA\/|; wv\)|WebView/i.test(ua);
}
function __mayaPaintBanner(){
  var el=document.getElementById('pwa-banner');
  if(!el || __mayaStandalone()){ if(el){ el.hidden=true; el.innerHTML=''; } document.body.classList.remove('has-pwa-banner'); return; }
  try{ if(sessionStorage.getItem('maya_pwa_hide')==='1'){ el.hidden=true; document.body.classList.remove('has-pwa-banner'); return; } }catch(e){}
  var ua=navigator.userAgent||'';
  var android=/Android/i.test(ua);
  var ios=/iPhone|iPad|iPod/i.test(ua);
  var html='';
  var x='<button type="button" class="pwa-x" onclick="try{sessionStorage.setItem(\'maya_pwa_hide\',\'1\')}catch(e){};var b=document.getElementById(\'pwa-banner\');if(b){b.hidden=true;}document.body.classList.remove(\'has-pwa-banner\')">×</button>';
  if(window._pwaPrompt){
    html='<b>Instalar o app</b><span>Fica na tela inicial, igual um aplicativo.</span><button type="button" onclick="installApp()">Instalar</button>'+x;
  } else if(__mayaInApp()){
    html='<b>Abra no Chrome</b><span>A busca do Google e o WhatsApp não instalam. Abra no Chrome.</span><button type="button" onclick="openInChrome()">Abrir no Chrome</button>'+x;
  } else if(android){
    html='<b>Instalar o app</b><span>Chrome → menu ⋮ → Instalar app.</span><button type="button" onclick="installApp()">Como instalar</button>'+x;
  } else if(ios){
    html='<b>Instalar o app</b><span>Safari → Compartilhar → Adicionar à Tela de Início.</span><button type="button" onclick="installApp()">Como instalar</button>'+x;
  } else {
    html='<b>Instalar o app</b><span>Chrome ou Edge: menu ⋮ → Instalar MAYA Garden.</span><button type="button" onclick="installApp()">Instalar</button>'+x;
  }
  el.innerHTML=html;
  el.hidden=false;
  document.body.classList.add('has-pwa-banner');
}
window.openInChrome=function(){
  var host=location.host+location.pathname+location.search;
  location.href='intent://'+host+'#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url='+encodeURIComponent(location.href)+';end';
};
window.installApp = async function(){
  if(__mayaStandalone()){ if(window.toast) toast('O app já está instalado.'); return; }
  if(window._pwaPrompt){
    try{ window._pwaPrompt.prompt(); await window._pwaPrompt.userChoice; }catch(e){}
    window._pwaPrompt=null;
    __mayaPaintBanner();
    return;
  }
  var ua=navigator.userAgent||'';
  if(__mayaInApp()){ openInChrome(); return; }
  if(/iPhone|iPad|iPod/i.test(ua)){
    if(window.toast) toast('No iPhone: Safari → Compartilhar → Adicionar à Tela de Início.');
    return;
  }
  if(/Android/i.test(ua) && /Firefox/i.test(ua)){
    if(window.toast) toast('No Firefox: menu ⋮ → Instalar.');
    return;
  }
  if(/Android/i.test(ua)){
    if(window.toast) toast('No Chrome: toque em ⋮ no canto e depois em Instalar app.');
    return;
  }
  if(window.toast) toast('No Chrome ou Edge: menu ⋮ → Instalar MAYA Garden.');
};
window.addEventListener('beforeinstallprompt',function(e){
  e.preventDefault();
  window._pwaPrompt=e;
  window.dispatchEvent(new Event('maya-pwa-ready'));
  __mayaPaintBanner();
});
window.addEventListener('appinstalled',function(){
  window._pwaPrompt=null;
  __mayaPaintBanner();
});
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  navigator.serviceWorker.register('/sw.js',{scope:'/'}).then(function(reg){try{reg.update();}catch(e){}}).catch(function(){});
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    try{ if(sessionStorage.getItem('maya_sw_reload')==='1') return; sessionStorage.setItem('maya_sw_reload','1'); }catch(e){}
    location.reload();
  });
}
window.addEventListener('DOMContentLoaded', __mayaPaintBanner);
setTimeout(__mayaPaintBanner, 1200);
</script>
</body>
</html>
