<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Autorização MAYA</title>
<style>
  body{font-family:system-ui,sans-serif;background:#143028;color:#f4f7f4;margin:0;padding:28px}
  h1{font-size:22px;margin:0 0 8px}
  p{line-height:1.4}
  pre{background:#fff;color:#143028;border-radius:12px;padding:16px;font-size:15px;white-space:pre-wrap;word-break:break-all}
  button{margin-top:12px;background:#3d8f4a;color:#fff;border:0;border-radius:12px;padding:14px 18px;font-weight:700;font-size:16px}
</style>
</head>
<body>
<h1>Autorização do Supabase</h1>
<p id="hint">Copie o código e cole na conversa.</p>
<pre id="code">Lendo…</pre>
<button type="button" id="copy">Copiar código</button>
<script>
const q = new URLSearchParams(location.search);
const code = q.get('code') || '';
const error = q.get('error_description') || q.get('error') || '';
const box = document.getElementById('code');
if (code) {
  box.textContent = code;
} else {
  box.textContent = error || 'Não veio código. Abra o link de autorização de novo.';
  document.getElementById('hint').textContent = 'A autorização não voltou um código.';
}
document.getElementById('copy').onclick = async () => {
  try { await navigator.clipboard.writeText(box.textContent); document.getElementById('hint').textContent = 'Código copiado. Cole na conversa.'; }
  catch (e) { document.getElementById('hint').textContent = 'Selecione o código e copie manualmente.'; }
};
</script>
</body>
</html>
